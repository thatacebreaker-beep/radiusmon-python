services:
  nginx:
    image: nginx:stable-alpine
    container_name: radiusmon-nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile    
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    configs:
      - source: nginx.conf
        target: /etc/nginx/conf.d/nginx.conf
        uid: "10001"
        gid: "10001"
        mode: 0444
    ports:
      - "8082:80"
    depends_on:
      - radiusmon-python
    restart: always
    
  radiusmon-python:
    container_name: radiusmon-python
    build:
      context: .
      dockerfile: Dockerfile
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./eapol_conf:/etc/eapol_test/eap.conf:ro
    configs:
      - source: ca_pem_config
        target: /etc/eapol_test/ca.pem
        uid: "10001"
        gid: "10001"
        mode: 0444
      - source: computer_cert
        target: /etc/eapol_test/computer.pem
        uid: "10001"
        gid: "10001"
        mode: 0444
    secrets:
      - source: computer_key
        target: /etc/eapol_test/computer.key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: radius_secret
        target: /run/secrets/radius_secret
        uid: "10001"
        gid: "10001"
        mode: 0400
    environment:
      PYTHONUNBUFFERED: "1"
      SCRIPT_PATH: /usr/local/bin/check_radius.sh
      RADIUS_IP: "192.168.0.1"
      RADIUS_PORT: "1812"
      RADIUS_SECRET_FILE: /run/secrets/radius_secret
      TIMEOUT: "6"
      COOLDOWN: "15"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

configs:
  ca_pem_config:
    file: ./certs/ca.pem
  computer_cert:
    file: ./certs/computer.pem
  nginx_conf:
    content: |
        server {
            listen 80 http2;
            # listen 443 ssl;
            # server_name radiusmon-python.domain.local;

            # SSL Certificaten
            # ssl_certificate /etc/ssl/radiusmon-python.domain.local/fullchain.pem;
            # ssl_certificate_key /etc/ssl/radiusmon-python.domain.local/privkey.pem;

            # Aanbevolen basis SSL instellingen
            # Optimized SSL settings
            # ssl_protocols TLSv1.2 TLSv1.3;
            #ssl_prefer_server_ciphers auto;
            # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

            # server_name radiusmon-python.domain.local;
            # Security Headers
            add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Robust-Security "true";

            location / {
                proxy_pass http://radiusmon-python;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_connect_timeout 3600s;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_buffering off;
            }
        }
        
secrets:
  computer_key:
    file: ./certs/computer.key
  radius_secret:
    file: ./certs/radius_secret.txt
